<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEGAS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Video -->
    <video autoplay muted loop id="myVideo">
        <source src="media/poker.mp4" type="video/mp4">
    </video>

    <!-- Card Button -->
    <article class="board">
        <button id="videoControlButton" class="card" onclick="this.classList.toggle('flipped'); toggleForm()">
            <span class="wrapper">
                <span class="content">
                    <span class="face back"></span>
                    <span class="face front"></span>
                </span>
            </span>
        </button>
    </article>

    <!-- Enter Form -->
    <div class="container" id="registerContainer" style="display: none;">
        <div class="login-card">
            <h2>Welcome to Casino</h2>
            <form id="registerForm">
                <input type="text" id="username" placeholder="Nickname" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="button" id="loginBtn">Submit</button>
            </form>
        </div>
    </div>


    <!-- Vegas sign-->
    <main>
        <div class="sign"></div>
        <div class="text">
          <div class="welcome">
            <span>W</span>
            <span>E</span>
            <span>L</span>
            <span>C</span>
            <span>O</span>
            <span>M</span>
            <span>E</span>
          </div>
          <div class="to">
            <span>TO</span>
          </div>
          <div class="fab">Fabulous</div>
          <div class="las">LAS VEGAS</div>
          <div class="nv">NEVADA</div>
        </div>
      </main>

    <!-- JavaScript file -->
    <script src="script.js"></script>
</body>
</html>

<!-- Clock -->
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Saat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="clock" id="clock"></div>

    <script src="script.js"></script>
</body>
</html>
